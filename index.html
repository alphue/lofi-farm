<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lofi Çiftlik</title>
<style>
  html, body { margin: 0; height: 100%; background: #0e1220; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #0e1220; }
  #overlay[hidden] { display: none; }
  #start { font: 20px system-ui, sans-serif; color: #e8e4d8; background: #2a3050; border: 1px solid #4a5280; border-radius: 12px; padding: 14px 36px; cursor: pointer; }
  #start:hover { background: #343b64; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="overlay"><button id="start">Başla</button></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
